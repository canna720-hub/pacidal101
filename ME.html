<style>
:root{--bg:#F4EFE6;--paper:#FBF8F2;--ink:#1E2A44;--muted:#5E6676;--gold:#C9A24A;--deep:#8A6317;--line:#E3DACA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans TC',sans-serif;font-weight:500;line-height:1.6;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:520px;padding:48px 20px 40px;text-align:center}
.avatar{width:132px;height:132px;border-radius:50%;overflow:hidden;margin:0 auto;border:2px solid var(--gold);background:var(--bg)}
.avatar img{width:100%;height:100%;object-fit:contain;display:block;padding:8px}
h1{font-family:'Italiana',serif;font-weight:400;font-size:52px;letter-spacing:.06em;margin:20px 0 0;line-height:1}
.sub{font-size:15px;letter-spacing:.14em;color:var(--deep);margin-top:12px;font-weight:700}
.intro{font-size:15px;color:var(--muted);margin:14px auto 0;max-width:420px}
.links{display:flex;flex-direction:column;gap:14px;margin-top:30px}
.link{display:flex;align-items:center;justify-content:center;gap:10px;padding:17px 20px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font-size:17px;font-weight:700;letter-spacing:.04em;background:transparent;transition:background .2s,color .2s}
.link:hover,.link:active{background:var(--ink);color:var(--bg)}
.link.primary{background:var(--ink);color:var(--bg)}
.link.primary:hover{background:#2c3b5c}
.link small{display:block;font-size:14px;font-weight:500;opacity:.85;letter-spacing:.04em;line-height:1.5;margin-top:4px}
.tx{display:flex;flex-direction:column;align-items:center}
footer{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);line-height:1.8;display:grid;justify-content:center;justify-items:stretch}
footer .en{font-family:'Italiana',serif;font-size:20px;color:#5C4310;-webkit-text-stroke:.7px #5C4310;letter-spacing:.06em;text-align:center;white-space:nowrap}
footer p{margin:8px 0 0;font-size:12px;white-space:nowrap;text-align:center}
@media (max-width:380px){h1{font-size:44px}.link{font-size:16px;padding:15px 16px}}
</style>
